# Einheitlicher Stack — bündelt alle Selfhosted-Dienste unter dem website-Projekt:
# nginx (Reverse Proxy), certbot, trilium, open-webui, dashboard, dawarich, web, db.
# Netzwerkname bleibt `website_default`; der Dashboard-Header zeigt nur diesen
# einen Stack (plus separate Pills für Nextcloud/RoaringBot/Tausendsassa).
services:
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - website_static_volume:/app/staticfiles
      - website_media_volume:/app/media
      - website_certbot_certs:/etc/letsencrypt
      - website_certbot_www:/var/www/certbot
    networks:
      - default
      - tausendsassa
      - nextcloud
      - dashboard-network
      - dawarich

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - website_certbot_certs:/etc/letsencrypt
      - website_certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
                  while :; do
                    certbot renew;
                    sleep 12h & wait $${!};
                  done"

  # TriliumNext Notes — Markdown-/Hierarchie-Notizen mit KaTeX-LaTeX (notes.casparsadenius.de)
  trilium:
    image: triliumnext/trilium:stable
    restart: unless-stopped
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
      - TZ=Europe/Berlin
    volumes:
      - website_trilium_data:/home/node/trilium-data
    networks:
      - default

  # Open WebUI — Chat-Interface (chat.casparsadenius.de), Daten im Volume `open-webui`
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      AUXILIARY_EMBEDDING_MODEL: TaylorAI/bge-micro-v2
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      WEBUI_URL: https://chat.casparsadenius.de
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      WHISPER_MODEL: base
      OLLAMA_BASE_URL: /ollama
      WEB_LOADER_ENGINE: playwright
      PLAYWRIGHT_BROWSERS_PATH: /app/backend/data/cache/playwright
    volumes:
      - open-webui:/app/backend/data
    networks:
      - default

  # Dawarich — Zeitstrahl/Location-Tracking (timeline.casparsadenius.de), eigener DB/Redis-Stack
  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - dawarich_shared:/data
    networks:
      - dawarich

  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    shm_size: 1G
    container_name: dawarich_db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DAWARICH_DB_USER:-postgres} -d ${DAWARICH_DB_NAME:-dawarich_development}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${DAWARICH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
      POSTGRES_DB: ${DAWARICH_DB_NAME:-dawarich_development}
    volumes:
      - dawarich_db_data:/var/lib/postgresql/data
      - dawarich_shared:/var/shared
    networks:
      - dawarich

  dawarich_app:
    image: freikin/dawarich:latest
    container_name: dawarich_app
    restart: unless-stopped
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: [ 'bin/rails', 'server', '-p', '3000', '-b', '::' ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO - --header='X-Forwarded-Proto: https' http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DAWARICH_DB_USER:-postgres}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich_development}
      APPLICATION_HOSTS: timeline.casparsadenius.de,127.0.0.1,::1,localhost
      APPLICATION_PROTOCOL: https
      DOMAIN: timeline.casparsadenius.de
      TIME_ZONE: Europe/Berlin
      DISTANCE_UNIT: km
      PROMETHEUS_EXPORTER_ENABLED: "false"
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      WEB_CONCURRENCY: 1
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: 5
    volumes:
      - dawarich_public:/var/app/public
      - dawarich_watched:/var/app/tmp/imports/watched
      - dawarich_storage:/var/app/storage
      - dawarich_db_data:/dawarich_db_data
    networks:
      - dawarich

  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich_sidekiq
    restart: unless-stopped
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: [ 'sidekiq' ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f sidekiq" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DAWARICH_DB_USER:-postgres}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich_development}
      APPLICATION_HOSTS: timeline.casparsadenius.de,127.0.0.1,::1,localhost
      APPLICATION_PROTOCOL: https
      DOMAIN: timeline.casparsadenius.de
      TIME_ZONE: Europe/Berlin
      DISTANCE_UNIT: km
      PROMETHEUS_EXPORTER_ENABLED: "false"
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      BACKGROUND_PROCESSING_CONCURRENCY: 3
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: 5
    volumes:
      - dawarich_public:/var/app/public
      - dawarich_watched:/var/app/tmp/imports/watched
      - dawarich_storage:/var/app/storage
    networks:
      - dawarich

  # Ops-Dashboard (FastAPI) — dash.casparsadenius.de, Basic Auth via nginx
  dashboard:
    build: /root/dashboard
    container_name: dashboard
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - /root/roaringbot/data:/data/roaringbot:ro
      - /root/Tausendsassa/data:/data/tausendsassa:ro
      - /root/dashboard-data:/data/dashboard-host:ro
      - dashboard_history:/data/dashboard
    env_file:
      - /root/dashboard/.env
    networks:
      - default
      - tausendsassa
      - roaringbot
      - dashboard-network

  # Website-Datenbank (PostGIS)
  db:
    image: postgis/postgis:16-3.4
    container_name: website-db
    restart: unless-stopped
    volumes:
      - website_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: travelsite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Website (Django)
  web:
    build:
      context: /root/website
    container_name: website-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - /root/website:/app
      - website_static_volume:/app/staticfiles
      - website_media_volume:/app/media
    env_file:
      - /root/website/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: website_default
  tausendsassa:
    name: tausendsassa-network
    external: true
  roaringbot:
    name: roaringbot-network
    external: true
  nextcloud:
    name: nextcloud_default
    external: true
  # Von der Website-Struktur übernommen: bleibt für den social-preview-Container erhalten
  dashboard-network:
    name: dashboard-network
    driver: bridge
  dawarich:
    name: website_dawarich
    driver: bridge

volumes:
  website_static_volume:
    external: true
  website_media_volume:
    external: true
  website_certbot_certs:
    external: true
  website_certbot_www:
    external: true
  website_trilium_data:
    external: true
  website_postgres_data:
    external: true
  dashboard_history:
    external: true
    name: dashboard_dashboard_history
  open-webui:
    external: true
    name: open-webui
  dawarich_db_data:
  dawarich_shared:
  dawarich_public:
  dawarich_watched:
  dawarich_storage:
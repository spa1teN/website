# Immich — HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name immich.casparsadenius.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name immich.casparsadenius.de;
    client_max_body_size 50000M;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    ssl_certificate /etc/letsencrypt/live/immich.casparsadenius.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immich.casparsadenius.de/privkey.pem;

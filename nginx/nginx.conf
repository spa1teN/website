resolver 127.0.0.11 valid=10s ipv6=off;

# Cache for the public share-page images (og:image / twitter:image) on
# bot.wannspieltbig.de. Crawlers (WhatsApp/Bluesky/Discord/X) re-fetch these
# every time a link is shared; serving them from nginx avoids the external-API
# + logo-fetch latency on repeat crawls. Keyed on full request URI.
proxy_cache_path /var/cache/nginx/share levels=1:2 keys_zone=share_cache:10m
	max_size=200m inactive=2h use_temp_path=off;

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name casparsadenius.de www.casparsadenius.de;
    client_max_body_size 500M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name casparsadenius.de www.casparsadenius.de;
    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/casparsadenius.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casparsadenius.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /staticfiles/ {
        alias /app/staticfiles/;
        # Force revalidation so browsers never run stale JS/CSS against new HTML after a deploy
        add_header Cache-Control "no-cache";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-USER $remote_user;
    }

    # Admin index page (custom management dashboard) — Django @login_required only,
    # no nginx basic auth (uses session from /trips/manage/ login)
    location /manage/ {
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-USER $remote_user;
    }

    # Public trip pages (map, trip detail) – no auth
    location /trips/ {
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Owner-only trip management – nginx basic auth + Django @login_required
    location /trips/manage/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-USER $remote_user;
    }


    # Legacy URL redirects (renamed 2026-08): /about/* → /links/*, /diary/ → /trips/
    # (exakte /about/ ist seit 2026-08 die interaktive CV-Seite, kein Redirect)
    rewrite ^/about/(.+)$ /links/$1 permanent;
    rewrite ^/diary/?$ /trips/ permanent;
    rewrite ^/diary/(.*)$ /trips/$1 permanent;

    # Redirect Django's login/logout URLs (now handled by nginx basic auth)
    location /accounts/ {
        return 302 /admin/;
    }

    location / {
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── wannspieltbig-social-preview Share Pages ─────────────────────────────────
server {
    listen 80;
    server_name bot.wannspieltbig.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bot.wannspieltbig.de;

    ssl_certificate /etc/letsencrypt/live/bot.wannspieltbig.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.wannspieltbig.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Feedback API stays internal — block at the edge.
    location /api/ {
        return 404;
    }

    # Status page shortcut → RoaringBot status on the main site.
    location = /status {
        return 301 https://casparsadenius.de/status/roaringbot;
    }

    # Everything else: public share pages at clean short URLs.
    # Served by the standalone wannspieltbig-social-preview container
    # (formerly RoaringBot, extracted 2026-08).
    # /                   → match list
    # /{id}               → match page (og: tags + JS redirect)
    # /{id}/image.jpg     → versus thumbnail
    # /{id}/image-twitter.jpg → stripped twitter:image variant
    # /share/… and /share-match/ → legacy paths (still work)
    location / {
        set $share_upstream wannspieltbig-social-preview:8080;
        proxy_pass http://$share_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Cache the share images + match/list pages in nginx. Social crawlers
        # re-fetch these on every share; serving from the local cache removes
        # the external-API round-trip and logo fetch for repeat crawls.
        # Only cache successful (200) responses that have no Set-Cookie and a
        # non-empty body. Images carry Cache-Control: max-age=3600, which
        # nginx honours for cache expiry.
        proxy_cache share_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key $scheme$host$request_uri;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status;
    }
}

# ── Tausendsassa Bot Webapp ──────────────────────────────────────────────────
server {
    listen 80;
    server_name tausendsassa.casparsadenius.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tausendsassa.casparsadenius.de;

    ssl_certificate /etc/letsencrypt/live/tausendsassa.casparsadenius.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tausendsassa.casparsadenius.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Discord Activity CORS headers
    add_header Access-Control-Allow-Origin "https://discord.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-discord-*" always;

    location / {
        set $ts_upstream tausendsassa-webapp:8081;
        proxy_pass         http://$ts_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}


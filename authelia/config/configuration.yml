###############################################################
# Authelia — zentraler SSO-Login für map/cloud/fotos.sadenius.eu
# Portal: https://sadenius.eu (nginx → authelia:9091)
###############################################################
server:
  address: 'tcp://:9091'
  endpoints:
    authz:
      auth-request:
        implementation: 'AuthRequest'

log:
  level: info

theme: dark

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/config/secrets/reset_password_jwt_secret" }}'

authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 64

access_control:
  default_policy: deny
  rules:
    - domain: 'sadenius.eu'
      resources:
        - '^/portal/?$'
        - '^/portal/.+$'
      policy: one_factor

session:
  name: authelia_session
  secret: '{{ secret "/config/secrets/session_secret" }}'
  same_site: lax
  inactivity: 5m
  expiration: 1h
  remember_me: 1M
  cookies:
    - domain: 'sadenius.eu'
      authelia_url: 'https://sadenius.eu'
      default_redirection_url: 'https://sadenius.eu/portal/'

storage:
  encryption_key: '{{ secret "/config/secrets/storage_encryption_key" }}'
  local:
    path: /config/db.sqlite3

notifier:
  smtp:
    address: 'submissions://smtp.strato.de:465'
    timeout: '5s'
    username: noreply@casparsadenius.de
    password: '{{ secret "/config/secrets/smtp_password" }}'
    sender: "Authelia <noreply@casparsadenius.de>"
    subject: '[Authelia] {title}'
    startup_check_address: 'test@casparsadenius.de'

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/config/secrets/oidc_hmac_secret" }}'
    jwks:
      - algorithm: RS256
        key: {{ secret "/config/secrets/jwks_rsa.key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'dawarich'
        client_name: 'Dawarich'
        client_secret: '{{ secret "/config/secrets/client_dawarich" }}'
        authorization_policy: one_factor
        pre_configured_consent_duration: '1 week'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://map.sadenius.eu/users/auth/openid_connect/callback'
        scopes:
          - openid
          - profile
          - email
        response_types:
          - code
        grant_types:
          - authorization_code
        token_endpoint_auth_method: client_secret_basic

      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: '{{ secret "/config/secrets/client_immich" }}'
        authorization_policy: one_factor
        pre_configured_consent_duration: '1 week'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://fotos.sadenius.eu/auth/login'
          - 'https://fotos.sadenius.eu/user-settings'
          - 'app.immich:///oauth-callback'
        scopes:
          - openid
          - profile
          - email
        response_types:
          - code
        grant_types:
          - authorization_code
        token_endpoint_auth_method: client_secret_post

      - client_id: 'nextcloud'
        client_name: 'Nextcloud'
        client_secret: '{{ secret "/config/secrets/client_nextcloud" }}'
        authorization_policy: one_factor
        pre_configured_consent_duration: '1 week'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://cloud.sadenius.eu/apps/user_oidc/code'
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        token_endpoint_auth_method: client_secret_post
        revocation_endpoint_auth_method: client_secret_post